[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kedro-lasso-demo"
version = "0.1.0"
description = "Kedro, JupyterLab, MLflow and SQLite: a reproducible Lasso workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kedro[jupyter]>=1.7,<2",
  "kedro-datasets[pandas-sqlquerydataset,pandas-sqltabledataset,pandas-parquetdataset,pickle-pickledataset,json-jsondataset]>=9.0,<10",
  "kedro-viz>=12,<13",
  "jupyterlab>=4.4,<5",
  "mlflow>=3.7,<4",
  "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "sqlalchemy>=2,<3",
  "matplotlib>=3.9,<4",
  "ipykernel>=6.29,<8",
  # Kedro 1.7 still uses the resolver API deprecated by OmegaConf 2.4.
  "omegaconf>=2.3,<2.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbconvert>=7,<8"]

[project.scripts]
demo = "kedro_lasso.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "kedro_lasso"
project_name = "Kedro Lasso Lab"
kedro_init_version = "1.7.0"
source_dir = "src"
tools = ["Jupyter", "Data Structure", "Testing", "Linting"]
example_pipeline = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
